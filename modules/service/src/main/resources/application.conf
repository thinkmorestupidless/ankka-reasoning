# The service's own configuration. It sits above ankka's defaults (ankka-runtime's reference.conf)
# and the platform's cluster overlay. Every key under `reasoning` has an environment override, and
# a setting is read once at start: changing one is a restart.
#
# The database and the HTTP port are ankka's: ANKKA_DB_* and ANKKA_HTTP_PORT, set by the platform
# in a deployment and defaulting to what docker-compose.yml starts.
ankka.service.name = "reasoning"

# How often a consumer asks the database what has changed. A graph consumer over a key value
# entity's state is fed by this poll alone, so it is the floor under how long a record takes to
# reach the graph; Pekko's default is three seconds. It is the polling knob and not the
# `behind-current-time` guard, which is left alone. ankka's control plane shortens the same setting.
pekko.persistence.r2dbc.refresh-interval = 1s

# `POST /graph/wait` holds a request open for up to `reasoning.wait-limit-max-ms`; Pekko HTTP's
# default request timeout is twenty seconds, after which it answers the wait itself, as text. The
# timeout is kept above the longest wait the service accepts.
pekko.http.server.request-timeout = 60s

reasoning {
  # The delta topic the graph is published to. The broker is ankka's ANKKA_KAFKA_BOOTSTRAP_SERVERS;
  # with none set, records are held and nothing is published.
  graph-topic = "reasoning-graph"
  graph-topic = ${?REASONING_GRAPH_TOPIC}

  # The graph database the answers read. With no uri, every route that reads it answers 503.
  neo4j {
    uri = ""
    uri = ${?REASONING_NEO4J_URI}
    username = ""
    username = ${?REASONING_NEO4J_USERNAME}
    password = ""
    password = ${?REASONING_NEO4J_PASSWORD}
    database = "neo4j"
    database = ${?REASONING_NEO4J_DATABASE}
  }

  # The longest excerpt of a piece of evidence, in characters.
  excerpt-limit = 2000
  excerpt-limit = ${?REASONING_EXCERPT_LIMIT}

  # The longest a /graph/wait may be asked to wait, in milliseconds.
  wait-limit-max-ms = 30000
  wait-limit-max-ms = ${?REASONING_WAIT_LIMIT_MAX_MS}

  # Writers, comma separated, who may withdraw the text of any record.
  stewards = ""
  stewards = ${?REASONING_STEWARDS}

  # The holders the appraiser may be run for, comma separated: registered when the service starts,
  # of the kind `agent`, spoken for by the writer `blueprint:appraiser`.
  appraiser-holders = "appraiser-a,appraiser-b"
  appraiser-holders = ${?REASONING_APPRAISER_HOLDERS}

  # A directory of golden set files (question.json and a file per tranche). A file there wins over
  # the one of the same name the service carries; with none set, the service's own are read.
  golden-set = ""
  golden-set = ${?REASONING_GOLDEN_SET}
}
