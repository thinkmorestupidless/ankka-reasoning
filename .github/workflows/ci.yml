name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The merge sink's released image cannot be pulled without a credential (research F8), so it
      # is built from the tag it was released from and given the name the build asks for. Remove
      # these two steps when the package is public.
      - uses: actions/checkout@v5
        with:
          repository: thinkmorestupidless/ankka-flow
          ref: v0.3.0
          fetch-depth: 0
          path: ankka-flow
      - name: Build the merge sink's image from ankka-flow v0.3.0
        working-directory: ankka-flow
        run: |
          sbt sidecar/Docker/publishLocal
          docker tag ankka-flow-sidecar:0.3.0 ghcr.io/thinkmorestupidless/ankka-flow-sidecar:0.3.0
      - run: sbt scalafmtCheckAll scalafmtSbtCheck compile test

  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: >
          uvx --from "git+https://github.com/thinkmorestupidless/speckit-bdd@v0.2.0#subdirectory=checker"
          speckit-bdd check --root . --glossary GLOSSARY.md --features features --specs specs
