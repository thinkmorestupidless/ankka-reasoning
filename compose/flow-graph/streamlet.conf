# The merge sink's sidecar on the compose network: a stage block and no process. In a cluster the
# operator renders the same file from deploy/pipeline/blueprint.conf and mounts the connection
# Secret at /etc/flow/neo4j. descriptor.json beside it is the built-in's, copied from ankka-flow
# v0.3.0, protocol/fixtures/builtin/neo4j-merge-sink.json.
flow {
  pipeline  = reasoning-graph
  streamlet = graph
  config    = { secret = "neo4j-local", transaction-timeout = "30s" }
  stage {
    name = "neo4j-merge-sink"
    neo4j { credentials-dir = "/etc/flow/neo4j" }
  }
  inlets {
    in {
      topic             = "reasoning-graph"
      bootstrap.servers = "kafka:9092"
      consumer-config { auto.offset.reset = earliest }
      batch { max-records = 500, max-bytes = 1 MiB }
    }
  }
}
