# The pipeline that fills the graph database: ankka-flow's built-in merge sink and nothing else.
# The topic is the pipeline's own, under the name the service publishes to, so the operator creates
# it compacted. Deploy this before the service: ankka creates no topics, and a topic that came into
# being on first use would not be compacted.
blueprint {
  name = reasoning-graph
  streamlets {
    graph = builtin/neo4j-merge-sink
  }
  topics {
    reasoning-graph {
      topic.name = "reasoning-graph"
      consumers  = [graph.in]
      partitions = 3
      replicas   = 1
      consumer-config { auto.offset.reset = earliest }
      # The longest a superseded record may wait to be compacted away: what bounds how long
      # withdrawn text can stay in the log.
      topic { max.compaction.lag.ms = 86400000 }
    }
  }
}
